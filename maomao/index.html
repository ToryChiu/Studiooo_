<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow,noarchive"><title>页面已迁移</title><style>body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#f8f6f1;color:#293c35;margin:0;padding:40px 20px}main{max-width:480px;margin:8vh auto;background:white;border:1px solid #e6e8df;border-radius:22px;padding:28px}h1{font-size:25px}p{font-size:15px;line-height:1.8;color:#71816e}button{font:inherit;background:#293c35;border:0;border-radius:12px;color:white;padding:13px 18px;cursor:pointer}#status{font-size:13px}</style></head><body><main><h1>此页面已迁移</h1><p>请使用你收到的新访问链接。<br>原先保存在这台设备、这个浏览器里的记录，可以先导出，再到新页面导入。</p><button id="export">导出本机记录 JSON</button><p id="status" role="status"></p><p>导出文件仅保存在你的设备上，不会上传。此操作不会删除原记录。</p></main><script>document.getElementById('export').onclick=()=>{try{const diary=JSON.parse(localStorage.getItem('maomao-diary-v1')||'{"days":{}}'),review=JSON.parse(localStorage.getItem('maomao-review-v1')||'{"version":1,"entries":{}}');const payload={format:'ondiet-migration',version:1,exportedAt:new Date().toISOString(),diary,review};const url=URL.createObjectURL(new Blob([JSON.stringify(payload,null,2)],{type:'application/json'}));const a=document.createElement('a');a.href=url;a.download='private-records-backup-'+new Date().toISOString().slice(0,10)+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);document.getElementById('status').textContent='已导出。请保留文件，到新页面选择导入。'}catch(error){document.getElementById('status').textContent='导出失败，请勿清理浏览器数据：'+error.message}};</script></body></html>
